<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EZOCORE AI</title>
    <!-- Подключаем официальное ядро Telegram WebApp -->
    <script src="https://telegram.org"></script>
    <!-- Исправлено: Подключаем реальный и стабильный движок Three.js -->
    <script src="https://cloudflare.com"></script>
    <style>
        body {
            margin: 0; padding: 0; background-color: #121517; overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100vh;
        }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .brand-code {
            z-index: 10; margin-bottom: 8vh; text-align: center;
            font-size: 24px; font-weight: 300; letter-spacing: 0.15em; color: #FFFFFF;
            pointer-events: none; user-select: none;
        }
        .ai { color: #A0AAB2; font-weight: 100; }
    </style>
</head>
<body>

    <div id="canvas-container"></div>
    <div class="brand-code">EZOCORE <span class="ai">AI</span></div>

    <script>
        // Инициализация Telegram WebApp контекста
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand(); // Раскрываем на весь экран смартфона
        }

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        
        // Настройка камеры под мобильные экраны
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 6;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Группа для вращения всей Квантовой Вертикали
        const verticalGroup = new THREE.Group();
        scene.add(verticalGroup);

        -- Хрустальная сфера подсознания (Electric/Cyan Blue) --
        const sphereGeo = new THREE.SphereGeometry(1.2, 32, 32);
        const sphereMat = new THREE.MeshPhysicalMaterial({
            color: 0x00E5FF,
            transmission: 0.6,
            roughness: 0.15,
            ior: 1.5,
            thickness: 1.5,
            transparent: true,
            opacity: 0.95
        });
        const crystalSphere = new THREE.Mesh(sphereGeo, sphereMat);
        verticalGroup.add(crystalSphere);

        -- Космическая Ось (Вертикальный золотой лазер) --
        const axisGeo = new THREE.CylinderGeometry(0.015, 0.015, 7, 8);
        const axisMat = new THREE.MeshBasicMaterial({ color: 0xFFD700 });
        const cosmicAxis = new THREE.Mesh(axisGeo, axisMat);
        verticalGroup.add(cosmicAxis);

        -- Закручивающиеся золотые нити-орбиты судеб --
        const orbitsGroup = new THREE.Group();
        verticalGroup.add(orbitsGroup);
        
        const orbitCount = 3;
        for (let i = 0; i < orbitCount; i++) {
            const orbitGeo = new THREE.TorusGeometry(1.6 + (i * 0.2), 0.008, 8, 64);
            const orbitMat = new THREE.MeshBasicMaterial({ color: 0xFFD700, transparent: true, opacity: 0.4 });
            const orbit = new THREE.Mesh(orbitGeo, orbitMat);
            orbit.rotation.x = Math.PI / 2 + (Math.random() - 0.5) * 0.5;
            orbit.rotation.y = (Math.random() - 0.5) * 0.5;
            orbitsGroup.add(orbit);
        }

        -- Настройка мощного студийного света для проявления 3D-рельефа --
        const mainLight = new THREE.DirectionalLight(0xffffff, 2.5);
        mainLight.position.set(5, 5, 5);
        scene.add(mainLight);

        const fillLight = new THREE.DirectionalLight(0x00E5FF, 1.5);
        fillLight.position.set(-5, -2, 2);
        scene.add(fillLight);

        const ambientLight = new THREE.AmbientLight(0x121517, 0.8);
        scene.add(ambientLight);

        // Интеграция тактильного отклика при клике на сферу
        window.addEventListener('click', () => {
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
                window.Telegram.WebApp.HapticFeedback.impactOccurred('medium'); // Вибрация пульса
            }
        });

        // Анимационный цикл
        let clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            let time = clock.getElapsedTime();
            
            // Дыхание сферы подсознания
            let scaleFactor = 1 + Math.sin(time * 1.5) * 0.03;
            crystalSphere.scale.set(scaleFactor, scaleFactor, scaleFactor);
            
            // Вращение элементов
            crystalSphere.rotation.y += 0.002;
            orbitsGroup.rotation.z -= 0.001;
            orbitsGroup.rotation.y += 0.003;
            
            renderer.render(scene, camera);
        }
        animate();

        // Адаптация под любые разрешения дисплеев
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
