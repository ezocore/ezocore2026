<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EZOCORE AI</title>
    <!-- Подключаем 3D-движок Three.js напрямую -->
    <script src="https://cloudflare.com"></script>
    <style>
        body {
            margin: 0; padding: 0; background-color: #121517; overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100vh;
        }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 75%; z-index: 1; }
        .brand-code {
            z-index: 10; margin-bottom: 8vh; text-align: center;
            font-size: 24px; font-weight: 300; letter-spacing: 0.15em; color: #FFFFFF;
        }
        .ai { color: #A0AAB2; font-weight: 100; }
    </style>
</head>
<body>

    <div id="canvas-container"></div>
    <div class="brand-code">EZOCORE <span class="ai">AI</span></div>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.z = 6;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);

        // Хрустальная сфера подсознания (Electric/Cyan Blue)
        const sphereGeo = new THREE.SphereGeometry(1.2, 32, 32);
        const sphereMat = new THREE.MeshPhysicalMaterial({
            color: 0x00E5FF, transmission: 0.7, roughness: 0.1, ior: 1.5, thickness: 1.0, transparent: true
        });
        const crystalSphere = new THREE.Mesh(sphereGeo, sphereMat);
        scene.add(crystalSphere);

        // Космическая Ось (Золотой лазерный луч)
        const axisGeo = new THREE.CylinderGeometry(0.01, 0.01, 5, 8);
        const axisMat = new THREE.MeshBasicMaterial({ color: 0xFFD700 });
        const cosmicAxis = new THREE.Mesh(axisGeo, axisMat);
        scene.add(cosmicAxis);

        // Настройка света
        const light = new THREE.DirectionalLight(0xffffff, 1.5);
        light.position.set(5, 5, 5);
        scene.add(light);
        const ambientLight = new THREE.AmbientLight(0x121517, 1);
        scene.add(ambientLight);

        let clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            let time = clock.getElapsedTime();
            let scaleFactor = 1 + Math.sin(time * 2) * 0.02;
            crystalSphere.scale.set(scaleFactor, scaleFactor, scaleFactor);
            crystalSphere.rotation.y += 0.003;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });
    </script>
</body>
</html>
