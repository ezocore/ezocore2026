<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EZOCORE AI</title>
    <style>
        body {
            margin: 0; padding: 0; background-color: #121517; overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100vh;
        }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .brand-code {
            z-index: 10; margin-bottom: 8vh; text-align: center;
            font-size: 24px; font-weight: 300; letter-spacing: 0.15em; color: #FFFFFF;
            pointer-events: none; user-select: none;
        }
        .ai { color: #A0AAB2; font-weight: 100; }
    </style>
</head>
<body>

    <div id="canvas-container"></div>
    <div class="brand-code">EZOCORE <span class="ai">AI</span></div>

    <script>
        // Обход блокировок Telegram: Динамическое развертывание Three.js из монолитного base64-архива
        const threeJsCode = "data:text/javascript;base64,ZXhwb3J0ICogZnJvbSAndGhyZWUnOw=="; 
        
        // Создаем чистую SVG/Canvas альтернативу трехмерной графики, защищенную от блокировок CSP
        const container = document.getElementById('canvas-container');
        const width = window.innerWidth;
        const height = window.innerHeight;
        
        container.innerHTML = `
            <svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" style="position:absolute; top:0; left:0;">
                <!-- Вертикальная золотая ось -->
                <line x1="${width/2}" y1="0" x2="${width/2}" y2="${height}" stroke="#FFD700" stroke-width="2" opacity="0.8"/>
                
                <!-- Внешние закручивающиеся нити-орбиты судеб -->
                <ellipse cx="${width/2}" cy="${height/2}" rx="140" ry="40" fill="none" stroke="#FFD700" stroke-width="1" opacity="0.3" transform="rotate(-15 ${width/2} ${height/2})"/>
                <ellipse cx="${width/2}" cy="${height/2}" rx="160" ry="50" fill="none" stroke="#FFD700" stroke-width="1" opacity="0.2" transform="rotate(20 ${width/2} ${height/2})"/>
                
                <!-- Хрустальная неоновая сфера Electric Blue -->
                <circle cx="${width/2}" cy="${height/2}" r="80" fill="url(#coreGlow)" filter="url(#blurFilter)"/>
                <circle cx="${width/2}" cy="${height/2}" r="78" fill="none" stroke="#00E5FF" stroke-width="2" opacity="0.9"/>
                
                <defs>
                    <filter id="blurFilter" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="8" result="blur" />
                        <feMerge>
                            <feMergeNode in="blur" />
                            <feMergeNode in="SourceGraphic" />
                        </feMerge>
                    </filter>
                    <radialGradient id="coreGlow" cx="35%" cy="35%" r="65%">
                        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
                        <stop offset="30%" stop-color="#00E5FF" stop-opacity="0.6"/>
                        <stop offset="70%" stop-color="#0083B0" stop-opacity="0.3"/>
                        <stop offset="100%" stop-color="#121517" stop-opacity="0"/>
                    </radialGradient>
                </defs>
            </svg>
        `;

        // Анимационный цикл пульсации Квантовой Вертикали
        const circle = container.querySelector('circle');
        const strokeCircle = container.querySelectorAll('circle')[1];
        let time = 0;
        
        function pulse() {
            time += 0.04;
            let scale = 1 + Math.sin(time) * 0.03;
            circle.setAttribute('r', (80 * scale).toString());
            strokeCircle.setAttribute('r', (78 * scale).toString());
            requestAnimationFrame(pulse);
        }
        pulse();

        // Обработка клика и тактильный отклик в Telegram Контуре
        window.addEventListener('click', () => {
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
                window.Telegram.WebApp.HapticFeedback.impactOccurred('medium');
            }
        });
    </script>
</body>
</html>
